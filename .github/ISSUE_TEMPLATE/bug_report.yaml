name: Bug report
description: Something isn't working as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't include API keys, tokens, or
        session recordings with private content. For security issues, use
        private vulnerability reporting (Security tab), not an issue.
  - type: input
    id: version
    attributes:
      label: SDK version
      description: The exact package version (e.g. 0.1.0).
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform / runtime
      description: OS, browser or runtime, and version.
      placeholder: "macOS 15.5 / Safari 18, Node 22, Python 3.12, iOS 18…"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest code snippet or steps that show the problem.
      render: shell
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant console output, stack traces, or error messages.
      render: shell
    validations:
      required: false
