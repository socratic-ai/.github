name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The use case or problem, not just the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like the SDK to provide?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've considered
    validations:
      required: false
